<div class="music-card">

<h3>Océane 1</h3>

<audio controls>
<source src="musiques/Oceane_1.mp3">
</audio>

<div class="actions">

<button id="like-oceane1" onclick="toggleLike('oceane1')">👍</button>

<button id="dislike-oceane1" onclick="toggleDislike('oceane1')">👎</button>

<button id="fav-oceane1" onclick="toggleFavorite('oceane1')">❤️</button>

<a class="download"
href="musiques/Oceane_1.mp3"
download>

📥

</a>

</div>

<textarea
id="comment-oceane1"
placeholder="💬 Commentaire">
</textarea>

<button
class="comment-btn"
onclick="saveComment('oceane1')">

Envoyer

</button>

<div
id="comments-oceane1"
class="comments">
